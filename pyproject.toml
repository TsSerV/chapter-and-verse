[project]
name = "chapter-and-verse"
version = "0.1.0"
description = "Question answering for UK legislation, citing the exact provision behind every claim at the version in force on the date asked."
readme = "README.md"
authors = [{ name = "Serhii Tsykunov" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
chapter-and-verse = "chapter_and_verse:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
filterwarnings = [
    # Inside Starlette's TestClient, not our code. Remove when Starlette fixes it.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.fastapi]
entrypoint = "chapter_and_verse.main:app"
