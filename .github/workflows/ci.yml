name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check src tests migrations
      - run: uv run mypy src
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build only, nothing is pushed.
      - run: docker build -t chapter-and-verse:ci .
      # An image can build and still fail to start, for example with a broken .venv.
      - run: docker run --rm chapter-and-verse:ci python -c "import chapter_and_verse.main"

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: helm lint --strict charts/chapter-and-verse

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.7"
          # The wrapper only adds step outputs, and no step reads them.
          terraform_wrapper: false

      - run: terraform fmt -check -recursive infra
      # No state and no AWS credentials. The lock file is used as committed.
      - run: terraform -chdir=infra/aws init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/aws validate
