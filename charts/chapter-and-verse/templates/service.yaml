apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "cav.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # The component label keeps the migration pod out of the Service.
  selector:
    {{- include "cav.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
