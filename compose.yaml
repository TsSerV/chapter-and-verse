# migrate and api run the same image with the same settings.
x-app: &app
  build: .
  image: chapter-and-verse:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/postgres

services:
  db:
    image: postgres:18-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # From Postgres 18 the data lives under /var/lib/postgresql, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP. On first start the image runs a temporary server on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Runs once, then exits. api starts only if it exits 0.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      # Local machine only, so no one else on the network can spend the Claude key.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
