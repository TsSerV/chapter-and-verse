# migrate and api run the same image against the same database.
x-app: &app
  build: .
  image: chapter-and-verse:dev
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/postgres

services:
  db:
    # Postgres 18 with the pgvector extension, for the vector search.
    image: pgvector/pgvector:pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Local machine only. For loading an Act and for the retrieval tests.
      - "127.0.0.1:5433:5432"
    volumes:
      # From Postgres 18 the data lives under /var/lib/postgresql, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP. On first start the image runs a temporary server on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Runs once, then exits. api starts only if it exits 0.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    # Only the API calls Claude, so only it gets the key in .env.
    env_file: .env
    ports:
      # Local machine only, so no one else on the network can spend the Claude key.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
